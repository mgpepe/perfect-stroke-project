{% load panel_tags %}
{# Shared paint form fields. Expects `paint` (may be None) in context. #}
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Name <span class="text-red-400">*</span></label>
    <input type="text" name="name" required value="{{ paint.name|default:'' }}"
           class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
  </div>
  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Type <span class="text-red-400">*</span></label>
    <select name="type" class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
      {% for v, l in paint_types %}<option value="{{ v }}" {% if paint.type == v %}selected{% endif %}>{{ l }}</option>{% endfor %}
    </select>
  </div>

  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Brand</label>
    <select name="brand" class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
      <option value="">—</option>
      {% for b in brands %}<option value="{{ b.pk }}" {% if paint.brand_id == b.pk %}selected{% endif %}>{{ b.name }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Brand model</label>
    <select name="brand_model" class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
      <option value="">—</option>
      {% for bm in brand_models %}<option value="{{ bm.pk }}" {% if paint.brand_model_id == bm.pk %}selected{% endif %}>{{ bm.brand.name }} — {{ bm.name }}</option>{% endfor %}
    </select>
  </div>

  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Color</label>
    <select name="color" class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
      <option value="">—</option>
      {% for c in colors %}<option value="{{ c.pk }}" {% if paint.color_id == c.pk %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Store</label>
    <select name="store" class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
      <option value="">—</option>
      {% for s in stores %}<option value="{{ s.pk }}" {% if paint.store_id == s.pk %}selected{% endif %}>{{ s.name }}</option>{% endfor %}
    </select>
  </div>

  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Ref (paint)</label>
    <input type="text" name="ref_paint" value="{{ paint.ref_paint|default:'' }}"
           class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm font-mono text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
  </div>
  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Ref (brand color)</label>
    <input type="text" name="ref_brand_color" value="{{ paint.ref_brand_color|default:'' }}"
           class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm font-mono text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
  </div>

  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Opacity</label>
    <select name="opacity" class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
      <option value="">—</option>
      {% for v, l in opacity_types %}<option value="{{ v }}" {% if paint.opacity == v %}selected{% endif %}>{{ l }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Opacity #</label>
    <input type="number" name="opacity_number" value="{{ paint.opacity_number|default:'' }}"
           class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm font-mono text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
  </div>

  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Quality</label>
    <select name="quality" class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
      <option value="">—</option>
      {% for v, l in quality_grades %}<option value="{{ v }}" {% if paint.quality == v %}selected{% endif %}>{{ l }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Price</label>
    <input type="number" step="0.01" name="price" value="{{ paint.price|default:'' }}"
           class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm font-mono text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
  </div>

  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Granulating</label>
    <select name="granulating" class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
      <option value="">—</option>
      <option value="true" {% if paint.granulating == True %}selected{% endif %}>Yes</option>
      <option value="false" {% if paint.granulating == False %}selected{% endif %}>No</option>
    </select>
  </div>
  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Staining</label>
    <select name="staining" class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
      <option value="">—</option>
      <option value="true" {% if paint.staining == True %}selected{% endif %}>Yes</option>
      <option value="false" {% if paint.staining == False %}selected{% endif %}>No</option>
    </select>
  </div>
</div>

<div>
  <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Image</label>
  {% if paint.image %}
    <div class="flex items-start gap-3 mb-2">
      <img src="{{ paint.image.url_path|r2url }}" class="h-20 w-20 rounded object-cover ring-1 ring-zinc-700">
      <div class="text-xs text-zinc-500 font-mono truncate">{{ paint.image.original_file_name }}</div>
    </div>
  {% endif %}
  <input type="file" name="image" accept="image/*"
         class="block w-full text-xs text-zinc-300 file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:bg-zinc-800 file:text-zinc-100 hover:file:bg-zinc-700">
  <p class="mt-1 text-xs text-zinc-500">Uploads to R2. Replaces existing image if set.</p>
</div>
