{% extends 'panel/base.html' %}
{% block title %}Delete paint{% endblock %}
{% block content %}
<div class="max-w-lg">
  <h1 class="text-2xl font-semibold text-zinc-100 mb-4">Delete paint?</h1>
  <div class="bg-zinc-900 ring-1 ring-red-500/30 rounded-lg p-6">
    <p class="text-zinc-300">You are about to delete:</p>
    <p class="mt-2 text-lg font-semibold text-zinc-100">{{ paint.name }}</p>
    <p class="mt-4 text-sm text-red-300">Linked strokes lose this paint reference. Pigment links are removed.</p>
    <form method="post" class="mt-6 flex items-center justify-end gap-3">
      {% csrf_token %}
      <a href="{% url 'panel:paints:detail' pk=paint.pk %}" class="px-4 py-2 text-sm text-zinc-300 hover:text-zinc-100">Cancel</a>
      <button type="submit" class="px-4 py-2 bg-red-500/90 text-white text-sm font-medium rounded-md hover:bg-red-500">Delete</button>
    </form>
  </div>
</div>
{% endblock %}
