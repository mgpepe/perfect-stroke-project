{# Contact form fields. Expects `contact` (may be None). #}
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">First name <span class="text-red-400">*</span></label>
    <input type="text" name="first_name" required value="{{ contact.first_name|default:'' }}"
           class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
  </div>
  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Last name</label>
    <input type="text" name="last_name" value="{{ contact.last_name|default:'' }}"
           class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
  </div>
  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Email</label>
    <input type="email" name="email" value="{{ contact.email|default:'' }}"
           class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
  </div>
  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Phone</label>
    <input type="text" name="phone" value="{{ contact.phone|default:'' }}"
           class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm font-mono text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
  </div>
</div>
<div>
  <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Notes</label>
  <textarea name="notes" rows="3"
            class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">{{ contact.notes|default:'' }}</textarea>
</div>
