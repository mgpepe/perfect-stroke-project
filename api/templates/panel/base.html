{% load static panel_tags %}
<!doctype html>
<html lang="en" class="h-full bg-zinc-950">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Panel{% endblock %} — Perfect Stroke</title>
  <meta name="color-scheme" content="dark">
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="h-full antialiased text-zinc-100 bg-zinc-950 flex"
      x-data="{ sidebarOpen: (() => { try { const v = localStorage.getItem('psp_sidebar_open'); return v === null ? true : v === '1'; } catch(e) { return true; } })() }"
      x-effect="(() => { try { localStorage.setItem('psp_sidebar_open', sidebarOpen ? '1' : '0'); } catch(e) {} })()">
  {% panel_sidebar %}

  <div class="flex-1 min-w-0">
    {% if messages %}
      <div class="px-8 pt-6 space-y-2">
        {% for m in messages %}
          <div class="rounded-md px-4 py-2 text-sm border
            {% if m.tags == 'success' %}bg-emerald-500/10 border-emerald-500/30 text-emerald-300
            {% elif m.tags == 'error' %}bg-red-500/10 border-red-500/30 text-red-300
            {% else %}bg-sky-500/10 border-sky-500/30 text-sky-300{% endif %}">
            {{ m }}
          </div>
        {% endfor %}
      </div>
    {% endif %}
    <main class="px-8 py-8">
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
