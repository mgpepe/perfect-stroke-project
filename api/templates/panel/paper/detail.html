{% extends 'panel/base.html' %}
{% load panel_tags %}
{% block title %}{{ paper|paper_label }}{% endblock %}

{% block content %}
<a href="{% url 'panel:papers:list' %}" class="text-sm text-zinc-500 hover:text-zinc-100 inline-flex items-center gap-1">
  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
  Back to papers
</a>
<div class="flex items-center justify-between mb-6 mt-2 gap-4 max-w-3xl">
  <div>
    <h1 class="text-2xl font-semibold text-zinc-100">{{ paper|paper_label }}</h1>
    <p class="text-xs font-mono text-zinc-500 mt-1">{{ paper.id }}</p>
  </div>
  <a href="{% url 'panel:papers:delete' pk=paper.pk %}" class="text-sm text-red-400 hover:text-red-300">Delete</a>
</div>

<div class="max-w-3xl">
  <form method="post" enctype="multipart/form-data" class="bg-zinc-900 rounded-lg ring-1 ring-zinc-800 p-6 space-y-5">
    {% csrf_token %}
    {% include 'panel/paper/_form_fields.html' %}
    <div class="flex justify-end">
      <button type="submit" class="px-4 py-2 bg-zinc-100 text-zinc-900 text-sm font-medium rounded-md hover:bg-white">Save</button>
    </div>
  </form>
</div>
{% endblock %}
