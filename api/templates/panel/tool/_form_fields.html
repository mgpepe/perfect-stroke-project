{% load panel_tags %}
{# Tool form fields. Expects `tool` in context. #}
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Brand</label>
    <select name="brand" class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
      <option value="">—</option>
      {% for b in brands %}<option value="{{ b.pk }}" {% if tool.brand_id == b.pk %}selected{% endif %}>{{ b.name }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Brand model</label>
    <select name="model" class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
      <option value="">—</option>
      {% for bm in brand_models %}<option value="{{ bm.pk }}" {% if tool.model_id == bm.pk %}selected{% endif %}>{{ bm.brand.name }} — {{ bm.name }}</option>{% endfor %}
    </select>
  </div>

  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Type</label>
    <select name="type" class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
      <option value="">—</option>
      {% for t in types %}<option value="{{ t.pk }}" {% if tool.type_id == t.pk %}selected{% endif %}>{{ t.name }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Shape</label>
    <select name="shape" class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
      <option value="">—</option>
      {% for s in shapes %}<option value="{{ s.pk }}" {% if tool.shape_id == s.pk %}selected{% endif %}>{{ s.tool_type.name }} — {{ s.name }}</option>{% endfor %}
    </select>
  </div>

  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Size</label>
    <select name="size" class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
      <option value="">—</option>
      {% for s in sizes %}<option value="{{ s.pk }}" {% if tool.size_id == s.pk %}selected{% endif %}>{{ s.tool_type.name }} — {{ s.size }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Hair type</label>
    <select name="brush_hair_type" class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
      <option value="">—</option>
      {% for h in brush_hair_types %}<option value="{{ h.pk }}" {% if tool.brush_hair_type_id == h.pk %}selected{% endif %}>{{ h.name }}</option>{% endfor %}
    </select>
  </div>

  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Store</label>
    <select name="store" class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
      <option value="">—</option>
      {% for s in stores %}<option value="{{ s.pk }}" {% if tool.store_id == s.pk %}selected{% endif %}>{{ s.name }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Quality</label>
    <select name="quality" class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
      <option value="">—</option>
      {% for v, l in quality_grades %}<option value="{{ v }}" {% if tool.quality == v %}selected{% endif %}>{{ l }}</option>{% endfor %}
    </select>
  </div>

  <div class="md:col-span-2">
    <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Price</label>
    <input type="number" step="0.01" name="price" value="{{ tool.price|default:'' }}"
           class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm font-mono text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
  </div>
</div>

<div>
  <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Image</label>
  {% if tool.image %}
    <div class="flex items-start gap-3 mb-2">
      <img src="{{ tool.image.url_path|r2url }}" class="h-20 w-20 rounded object-cover ring-1 ring-zinc-700">
      <div class="text-xs text-zinc-500 font-mono truncate">{{ tool.image.original_file_name }}</div>
    </div>
  {% endif %}
  <input type="file" name="image" accept="image/*"
         class="block w-full text-xs text-zinc-300 file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:bg-zinc-800 file:text-zinc-100 hover:file:bg-zinc-700">
  <p class="mt-1 text-xs text-zinc-500">Uploads to R2. Replaces existing image if set.</p>
</div>
