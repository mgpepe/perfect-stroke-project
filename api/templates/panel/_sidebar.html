{% load panel_tags %}
<script>
  // Pre-paint: apply the collapsed width before Alpine boots, to avoid flicker.
  (function () {
    try {
      var v = localStorage.getItem('psp_sidebar_open');
      var open = v === null ? true : v === '1';
      var css = document.createElement('style');
      css.textContent =
        '#psp-sidebar{width:' + (open ? '15rem' : '3.5rem') + '!important;transition:none!important;}' +
        '#psp-sidebar [data-collapse-hide]{' + (open ? '' : 'display:none!important;') + '}';
      document.head.appendChild(css);
      // allow transitions after the first paint
      requestAnimationFrame(function () { css.remove(); });
    } catch (e) {}
  })();
</script>

<aside id="psp-sidebar"
       class="h-screen flex flex-col flex-shrink-0 sticky top-0 overflow-hidden whitespace-nowrap transition-[width] duration-200 border-r border-zinc-800 bg-zinc-900/60"
       :class="sidebarOpen ? 'w-60' : 'w-14'">

  <!-- Header: logo + toggle -->
  <div class="flex items-center h-14 flex-shrink-0 border-b border-zinc-800 px-2"
       :class="sidebarOpen ? 'justify-between' : 'justify-center'">
    <a x-show="sidebarOpen" href="/panel/" class="flex items-center gap-2.5 px-2" data-collapse-hide>
      <div class="w-7 h-7 rounded-md bg-gradient-to-br from-zinc-200 to-zinc-500 flex items-center justify-center text-zinc-900 font-bold text-xs">PS</div>
      <span class="font-semibold text-zinc-100 text-sm">Perfect Stroke</span>
    </a>
    <button @click="sidebarOpen = !sidebarOpen"
            class="p-1.5 text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/50 rounded-md transition-colors"
            :title="sidebarOpen ? 'Collapse sidebar' : 'Expand sidebar'">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <line x1="9" y1="3" x2="9" y2="21"/>
      </svg>
    </button>
  </div>

  <nav class="flex-1 p-2 space-y-3 text-sm overflow-y-auto overflow-x-hidden [scrollbar-width:none]">
    {% for group in groups %}
      <div>
        <div x-show="sidebarOpen" data-collapse-hide
             class="px-3 text-[10px] font-semibold text-zinc-600 uppercase tracking-wider mb-1">{{ group.label }}</div>
        <div class="space-y-0.5">
          {% for item in group.items %}
            <a href="{{ item.url }}" title="{{ item.label }}"
               class="flex items-center gap-3 rounded-md transition-colors
                      {% if item.active %}bg-zinc-800 text-zinc-100{% else %}text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/50{% endif %}"
               :class="sidebarOpen ? 'px-3 py-1.5' : 'justify-center p-2'">
              {% include 'panel/_icon.html' with key=item.icon %}
              <span x-show="sidebarOpen" data-collapse-hide>{{ item.label }}</span>
            </a>
          {% endfor %}
        </div>
      </div>
    {% endfor %}
  </nav>

  <!-- Profile footer -->
  <div class="border-t border-zinc-800 p-2"
       :class="sidebarOpen ? '' : 'flex justify-center'">
    <div class="relative" x-data="{ menuOpen: false }" @click.outside="menuOpen = false">
      <button @click="menuOpen = !menuOpen"
              class="flex items-center gap-2.5 rounded-md hover:bg-zinc-800/50 transition-colors text-left"
              :class="sidebarOpen ? 'w-full p-2' : 'p-1.5'"
              title="{{ request.user.username }}">
        {% if request.user.picture_url %}
          <img src="{{ request.user.picture_url }}" alt=""
               class="w-8 h-8 rounded-full object-cover flex-shrink-0 ring-1 ring-zinc-700">
        {% else %}
          <div class="w-8 h-8 rounded-full bg-gradient-to-br from-fuchsia-500 to-amber-400 flex items-center justify-center text-white font-semibold text-sm flex-shrink-0">
            {% firstof request.user.first_name|first|upper request.user.username|first|upper %}
          </div>
        {% endif %}
        <div x-show="sidebarOpen" data-collapse-hide class="flex-1 min-w-0">
          <div class="text-sm text-zinc-100 truncate">{% firstof request.user.first_name request.user.username %}</div>
          <div class="text-[10px] text-zinc-500 truncate">{{ request.user.email|default:request.user.username }}</div>
        </div>
        <svg x-show="sidebarOpen" data-collapse-hide class="w-3.5 h-3.5 text-zinc-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>

      <div x-show="menuOpen" x-transition
           class="absolute z-50 bg-zinc-800 ring-1 ring-zinc-700 rounded-md shadow-lg min-w-[180px] overflow-hidden"
           :class="sidebarOpen ? 'bottom-full left-0 mb-2 right-0' : 'bottom-0 left-full ml-2'"
           style="display:none">
        <a href="/admin/" class="block px-3 py-2 text-sm text-zinc-300 hover:bg-zinc-700">Django admin</a>
        <form method="post" action="/admin/logout/" class="block border-t border-zinc-700">
          {% csrf_token %}
          <button type="submit" class="w-full text-left px-3 py-2 text-sm text-zinc-300 hover:bg-zinc-700">Sign out</button>
        </form>
      </div>
    </div>
  </div>
</aside>
