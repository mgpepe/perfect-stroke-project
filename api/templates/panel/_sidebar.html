{% load panel_tags %}
<aside class="w-60 shrink-0 bg-zinc-900/60 border-r border-zinc-800 flex flex-col min-h-screen">
  <a href="/panel/" class="px-5 py-5 flex items-center gap-3 group border-b border-zinc-800">
    <div class="w-8 h-8 rounded-md bg-gradient-to-br from-zinc-200 to-zinc-500 flex items-center justify-center text-zinc-900 font-bold text-sm">PS</div>
    <span class="font-semibold text-zinc-100 group-hover:text-white">Perfect Stroke</span>
  </a>

  <nav class="flex-1 p-3 space-y-4 text-sm overflow-y-auto">
    {% for group in groups %}
      <div>
        <div class="px-3 text-[10px] font-semibold text-zinc-600 uppercase tracking-wider mb-1">{{ group.label }}</div>
        <div class="space-y-0.5">
          {% for item in group.items %}
            <a href="{{ item.url }}" class="flex items-center gap-2.5 px-3 py-1.5 rounded-md
              {% if item.active %}bg-zinc-800 text-zinc-100{% else %}text-zinc-400 hover:text-zinc-100 hover:bg-zinc-800/50{% endif %}">
              <span class="w-1 h-1 rounded-full {% if item.active %}bg-zinc-100{% else %}bg-zinc-600{% endif %}"></span>
              {{ item.label }}
            </a>
          {% endfor %}
        </div>
      </div>
    {% endfor %}
  </nav>

  <div class="p-3 border-t border-zinc-800 text-sm">
    <div class="flex items-center justify-between gap-2">
      <span class="text-zinc-300 truncate">{{ request.user.username }}</span>
      <form method="post" action="/admin/logout/" class="inline">
        {% csrf_token %}
        <button type="submit" class="text-zinc-500 hover:text-zinc-100">Sign out</button>
      </form>
    </div>
    <a href="/admin/" class="block mt-2 text-zinc-500 hover:text-zinc-300 text-xs">Django admin →</a>
  </div>
</aside>
