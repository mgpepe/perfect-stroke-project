{% extends 'panel/base.html' %}
{% block title %}New device{% endblock %}

{% block content %}
<div class="max-w-xl">
  <a href="{% url 'panel:devices:list' %}" class="text-sm text-zinc-500 hover:text-zinc-100 inline-flex items-center gap-1">
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    Back to devices
  </a>
  <h1 class="text-2xl font-semibold text-zinc-100 mt-2 mb-6">New device</h1>

  <form method="post" class="bg-zinc-900 rounded-lg ring-1 ring-zinc-800 p-6 space-y-5">
    {% csrf_token %}
    <div>
      <label for="id" class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">ID <span class="text-red-400">*</span></label>
      <input type="text" name="id" id="id" value="{{ form.id|default:'' }}" required
             class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm font-mono text-zinc-100 placeholder-zinc-500 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none"
             placeholder="e.g. psp-epaper-02">
      <p class="mt-1 text-xs text-zinc-500">Stable string used by the device in its config. Lowercase, hyphens only.</p>
    </div>

    <div>
      <label for="name" class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Name</label>
      <input type="text" name="name" id="name" value="{{ form.name|default:'' }}"
             class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none"
             placeholder="Human-readable label">
    </div>

    <div>
      <label for="desired_git_ref" class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-1">Desired git ref</label>
      <input type="text" name="desired_git_ref" id="desired_git_ref" value="{{ form.desired_git_ref|default:'main' }}"
             class="block w-full rounded-md bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm font-mono text-zinc-100 focus:border-zinc-500 focus:ring-1 focus:ring-zinc-500 outline-none">
    </div>

    <div class="flex justify-end pt-2">
      <button type="submit" class="px-4 py-2 bg-zinc-100 text-zinc-900 text-sm font-medium rounded-md hover:bg-white">
        Create device
      </button>
    </div>
  </form>
</div>
{% endblock %}
